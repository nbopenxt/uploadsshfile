# 1.0.8 D-42 Snippet-Kommentare i18n (BuildSnippetGenerator-Vorlagen)
snippet.comment.header=UploadSSHFile automatischer Upload-Hook (taskId={0})
snippet.comment.yesSkip=D-33 Zielbestätigung übersprungen; --yes entfernen = bei jedem Lauf manuell mit y bestätigen
snippet.comment.guardBuildFailed=bei fehlgeschlagenem Build wird niemals hochgeladen
snippet.comment.ignoreExitValue=Upload-Fehler verändert das Build-Ergebnis nicht
snippet.comment.filesSingle=D-38: Upload-Liste = die beim letzten Schließen des Upload-Dialogs für diese taskId gespeicherte GUI-Snapshot-Liste (Rechtsklick bestimmt, was gespeichert wird; Mehrfachauswahl möglich). Dateien ändern = Dialog einmal öffnen und schließen; dieses Snippet muss nicht neu kopiert werden.
snippet.comment.filesBatch=Upload-Liste = die in dieser Stapelaufgabe gespeicherten Datei-Listen der Unteraufgaben. Dateien ändern = Stapelaufgabe bearbeiten und speichern; dieses Snippet muss nicht neu kopiert werden.
snippet.comment.hookAfter=Upload-Zeitpunkt: Der Upload läuft nach dem Task, an den diese Zeile gebunden ist - an build gebunden nach dem vollständigen Build, an war gebunden nach dem war-Task. Sie können 'build' durch einen vorhandenen Task-Namen Ihrer Wahl ersetzen.
snippet.comment.removeHook=Zeile löschen, um den automatischen Upload abzuschalten
snippet.comment.mavenNotVerified=NICHT VERIFIZIERT: Diese Vorlage wurde nicht gegen einen echten Build geprüft; Pfade und Anführungszeichen vor Verwendung prüfen (nach der package-Phase einhängen)
snippet.comment.antNotVerified=NICHT VERIFIZIERT: Diese Vorlage wurde nicht gegen einen echten Build geprüft; Pfade und Anführungszeichen vor Verwendung prüfen
snippet.comment.titleQuote=D-27: Fenstertitel muss in Anführungszeichen stehen
snippet.comment.osFamily=D-27: exakter os=-Abgleich wird unter Win11 stillschweigend übersprungen, daher osfamily
snippet.comment.xmlRunNote=D-33: --yes überspringt die Zielbestätigung (Ziele im GUI geprüft; ohne sie bei jeder Ausführung manuell mit y/N bestätigen). D-38: Dateiliste kommt aus der gespeicherten Konfiguration der taskId - kein Datei-Flag nötig.


