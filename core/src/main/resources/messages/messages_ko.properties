copy.snippet.menu.note=빌드 스크립트에 붙여 넣으면 빌드가 성공할 때마다 자동으로 업로드합니다. 업로드할 파일 = 이 작업에 저장된 목록(단일 작업 = 업로드 창을 마지막으로 닫을 때 저장된 항목. 다중 선택 가능, 변경하려면 창을 다시 열어 선택한 뒤 닫으면 됩니다. 배치 = 작업에 저장된 하위 작업 목록).
# 1.0.8 D-42 스니펫 주석 i18n(BuildSnippetGenerator 템플릿)
snippet.comment.header=UploadSSHFile 자동 업로드 훅 (taskId={0})
snippet.comment.yesSkip=D-33 대상 확인 생략; --yes를 삭제하면 실행마다 y로 수동 확인 필요
snippet.comment.guardBuildFailed=빌드 실패 시 절대 업로드하지 않음
snippet.comment.ignoreExitValue=업로드 실패는 빌드 결과를 바꾸지 않음
snippet.comment.filesSingle=D-38: 업로드 목록 = 이 taskId에 대해 업로드 창을 마지막으로 닫을 때 저장된 GUI 스냅샷(우클릭한 항목이 저장됩니다. 다중 선택 가능). 파일 변경 = 창을 다시 열어 닫기만 하면 됩니다. 이 스니펫을 다시 복사할 필요는 없습니다.
snippet.comment.filesBatch=업로드 목록 = 이 배치 작업에 저장된 각 하위 작업의 파일 목록. 파일 변경 = 배치 작업을 편집해 저장하면 됩니다. 이 스니펫을 다시 복사할 필요는 없습니다.
snippet.comment.hookAfter=업로드 시점 = 이 줄이 연결된 작업 완료後に 실행됩니다. build에 연결하면 전체 빌드 후, war면 war 작업 후입니다. 'build'는 프로젝트의 기존 작업 이름으로 바꿀 수 있습니다.
snippet.comment.removeHook=자동 업로드를 끄려면 이 줄을 삭제
snippet.comment.mavenNotVerified=미검증: 이 템플릿은 실제 빌드로 검증되지 않았습니다. 사용 전 경로와 따옴표를 확인하세요(package 페이즈 이후에 배치)
snippet.comment.antNotVerified=미검증: 이 템플릿은 실제 빌드로 검증되지 않았습니다. 사용 전 경로와 따옴표를 확인하세요
snippet.comment.titleQuote=D-27: 창 제목은 따옴표 필수
snippet.comment.osFamily=D-27: os 정확일치는 Win11에서 조용히 건너뛰므로 osfamily 사용
snippet.comment.xmlRunNote=D-33: --yes는 대상 확인을 건너뜁니다(GUI에서 확인 완료. 삭제하면 실행마다 y/N 수동 확인). D-38: 파일 목록은 taskId의 저장된 설정에서 읽으며 파일 플래그가 필요 없습니다.


