# 1.0.8 D-42 commentaires des snippets i18n (modèles BuildSnippetGenerator)
snippet.comment.header=UploadSSHFile : hook de téléversement automatique (taskId={0})
snippet.comment.yesSkip=D-33 confirmation des cibles ignorée ; supprimer --yes = confirmation manuelle par y à chaque exécution
snippet.comment.guardBuildFailed=aucun envoi si le build échoue
snippet.comment.ignoreExitValue=un échec d'envoi ne modifie pas le résultat du build
snippet.comment.filesSingle=D-38 : liste téléversée = l’instantané GUI enregistré pour ce taskId à la dernière fermeture de la fenêtre d'envoi (le clic droit détermine ce qui est enregistré ; sélection multiple possible). Changer les fichiers = rouvrir puis fermer la fenêtre une fois ; pas besoin de recopier ce fragment.
snippet.comment.filesBatch=Liste téléversée = les listes de fichiers enregistrées des sous-tâches de cette tâche par lot. Changer les fichiers = modifier puis enregistrer la tâche ; pas besoin de recopier ce fragment.
snippet.comment.hookAfter=Moment de l'envoi : le téléversement s'exécute après la tâche à laquelle cette ligne est rattachée - rattachée à build, après le build complet ; rattachée à war, après la tâche war. Vous pouvez remplacer 'build' par tout nom de tâche existant.
snippet.comment.removeHook=supprimez cette ligne pour désactiver l'envoi automatique
snippet.comment.mavenNotVerified=NON VÉRIFIÉ : ce modèle n'a pas été validé contre un vrai build ; vérifiez chemins et guillemets avant usage (à placer après la phase package)
snippet.comment.antNotVerified=NON VÉRIFIÉ : ce modèle n'a pas été validé contre un vrai build ; vérifiez chemins et guillemets avant usage
snippet.comment.titleQuote=D-27 : le titre de fenêtre doit rester entre guillemets
snippet.comment.osFamily=D-27 : une correspondance os= exacte est silencieusement ignorée sous Win11, donc osfamily
snippet.comment.xmlRunNote=D-33 : --yes saute la confirmation des cibles (vérifiées dans l'interface ; sans lui, confirmation manuelle y/N à chaque exécution). D-38 : la liste des fichiers provient de la configuration enregistrée du taskId - aucun indicateur de fichier nécessaire.


