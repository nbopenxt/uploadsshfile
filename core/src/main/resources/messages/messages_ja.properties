# 1.0.8 D-42 スニペット内コメント i18n（BuildSnippetGenerator テンプレート）
snippet.comment.header=UploadSSHFile 自動アップロードフック (taskId={0})
snippet.comment.yesSkip=D-33 送信先確認をスキップ；--yes を削除すると実行のたびに y で人力確認が必要
snippet.comment.guardBuildFailed=ビルド失敗時は絶対にアップロードしない
snippet.comment.ignoreExitValue=アップロード失敗はビルド結果に影響しない
snippet.comment.filesSingle=D-38：アップロード一覧＝この taskId に対してアップロード画面を最後に閉じたとき保存された GUI スナップショット（右クリックしたものが保存されます。複数選択可）。ファイルの変更＝画面を開いて閉じるだけ。このスニペットの再コピーは不要です。
snippet.comment.filesBatch=アップロード一覧＝このバッチタスクに保存された各サブタスクのファイル一覧。ファイルの変更＝バッチタスクを編集して保存。このスニペットの再コピーは不要です。
snippet.comment.hookAfter=アップロードのタイミング＝この行が結び付いたタスクの完了後に実行されます。build に結べばビルド全体の後、war なら war タスクの後。'build' はプロジェクト内の既存タスク名に変更可能です。
snippet.comment.removeHook=自動アップロードをオフにするにはこの行を削除
snippet.comment.mavenNotVerified=未検証：このテンプレートは実際のビルドで検証されていません。使用前にパスと引用符を確認してください（package フェーズ後に配置）
snippet.comment.antNotVerified=未検証：このテンプレートは実際のビルドで検証されていません。使用前にパスと引用符を確認してください
snippet.comment.titleQuote=D-27：ウィンドウタイトルは引用符必須
snippet.comment.osFamily=D-27：os の完全一致は Win11 で黙ってスキップされるため osfamily を使用
snippet.comment.xmlRunNote=D-33：--yes は送信先確認をスキップ（GUI で確認済み。削除すると実行のたびに y/N の人力確認が必要）。D-38：ファイル一覧は taskId の保存済み設定から取得され、ファイルフラグは不要です。


