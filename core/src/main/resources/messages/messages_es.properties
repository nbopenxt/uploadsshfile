# 1.0.8 D-42 comentarios de snippets i18n (plantillas BuildSnippetGenerator)
snippet.comment.header=UploadSSHFile hook de carga automática (taskId={0})
snippet.comment.yesSkip=D-33 confirmación de destinos omitida; quitar --yes = confirmación manual con y en cada ejecución
snippet.comment.guardBuildFailed=nunca se sube nada si la compilación falló
snippet.comment.ignoreExitValue=un fallo de subida no altera el resultado de la compilación
snippet.comment.filesSingle=D-38: lista de subida = la instantánea GUI guardada para este taskId al último cierre de la ventana de subida (el clic derecho decide qué se guarda; multiselección permitida). Cambiar archivos = abrir y cerrar la ventana una vez; no hay que recopiar este fragmento.
snippet.comment.filesBatch=Lista de subida = las listas de archivos guardadas de las subtareas de esta tarea por lotes. Cambiar archivos = editar y guardar la tarea; no hay que recopiar este fragmento.
snippet.comment.hookAfter=Momento de la subida: la subida se ejecuta después de la tarea a la que esta línea está enlazada - enlazada a build, tras la compilación completa; enlazada a war, tras la tarea war. Puede cambiar 'build' por cualquier nombre de tarea existente.
snippet.comment.removeHook=elimine esta línea para desactivar la subida automática
snippet.comment.mavenNotVerified=SIN VERIFICAR: esta plantilla no se ha validado contra una compilación real; revise rutas y comillas antes de usarla (engánchela después de la fase package)
snippet.comment.antNotVerified=SIN VERIFICAR: esta plantilla no se ha validado contra una compilación real; revise rutas y comillas antes de usarla
snippet.comment.titleQuote=D-27: el título de la ventana debe ir entre comillas
snippet.comment.osFamily=D-27: la coincidencia exacta de os= se omite en silencio en Win11, por eso osfamily
snippet.comment.xmlRunNote=D-33: --yes salta la confirmación de destinos (verificados en la GUI; sin él, confirmación manual y/N en cada ejecución). D-38: la lista de archivos proviene de la configuración guardada del taskId - sin indicador de archivo.


