snippet.comment.filesSingle=D-38: قائمة الرفع = لقطة GUI المحفوظة لهذا taskId عند آخر إغلاق لنافذة الرفع (النقر بالزر الأيمن يحدد ما يُحفظ؛ يُسمح بالتحديد المتعدد). لتغيير الملفات = أعد فتح النافذة وأغلقها مرة؛ لا حاجة لإعادة نسخ هذا المقطع.
snippet.comment.filesBatch=قائمة الرفع = قوائم الملفات المحفوظة للمهام الفرعية في مهمة الدفع هذه. لتغيير الملفات = عدّل المهمة واحفظها؛ لا حاجة لإعادة نسخ هذا المقطع.
snippet.comment.hookAfter=توقيت الرفع: يعمل الرفع بعد المهمة التي ترتبط بها هذه السطر - عند الربط بـ build يعمل بعد اكتمال البناء كله، وعند الربط بـ war بعد مهمة war. يمكنك استبدال 'build' بأي اسم مهمة قائم في المشروع.
snippet.comment.removeHook=احذف هذا السطر لإيقاف الرفع التلقائي
snippet.comment.mavenNotVerified=غير مُتحقق: هذا النموذج لم يُختبر ضد بناء حقيقي؛ تحقق المسارات والعلامات قبل الاستخدام (ضعه بعد مرحلة package)
snippet.comment.antNotVerified=غير مُتحقق: هذا النموذج لم يُختبر ضد بناء حقيقي؛ تحقق المسارات والعلامات قبل الاستخدام
snippet.comment.titleQuote=D-27: يجب إبقاء عنوان النافذة بين علامتي اقتباس
snippet.comment.osFamily=D-27: المطابقة الدقيقة لـ os تتجاهل بصمت في Win11 لذا نستخدم osfamily
snippet.comment.xmlRunNote=D-33: يتخطى --yes تأكيد الأهداف (تم التحقق منها في الواجهة؛ بدونه يلزم تأكيد يدوي y/N عند كل تنفيذ). D-38: قائمة الملفات تُقرأ من الإعدادات المحفوظة للمهمة حسب taskId - لا حاجة لراية ملف.


